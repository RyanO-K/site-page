<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan O'Keefe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Single error slot. Every reported error reuses this one element rather
       than stacking, so repeated failures replace in place instead of piling up. -->
  <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden>
    <span id="error-banner-text"></span>
    <button type="button" id="error-banner-dismiss" class="error-banner-dismiss" aria-label="Dismiss error">×</button>
  </div>

  <header class="site-header">
    <nav class="nav">
      <span class="nav-logo">Ryan O'Keefe</span>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
        <li id="auth-item"><!-- filled by JS --></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Hi, I'm Ryan.</h1>
        <p class="hero-sub">Software developer.</p>
      </div>
    </section>

    <section id="about" class="section">
      <div class="container">
        <h2>About</h2>
        <div id="about-content"><!-- filled by JS --></div>
        <div id="about-edit" hidden>
          <textarea id="about-textarea" rows="8"></textarea>
          <div class="about-edit-actions">
            <button id="about-save">Save</button>
            <button id="about-cancel" class="btn-ghost">Cancel</button>
          </div>
        </div>
        <button id="about-edit-btn" hidden>Edit</button>
      </div>
    </section>

    <section id="projects" class="section section-alt">
      <div class="container">
        <h2>Projects</h2>

        <div id="admin-panel" hidden>
          <form id="add-form">
            <input type="text" id="input-repo" placeholder="owner/repo" required />
            <input type="url" id="input-url" placeholder="Hosted URL" required />
            <button type="submit">Add Project</button>
          </form>
        </div>

        <div id="project-grid" class="project-grid">
          <!-- featured (first 3), filled by JS -->
        </div>

        <div id="gallery-wrap" hidden>
          <h3 class="gallery-heading">More projects</h3>
          <div id="project-gallery" class="project-gallery">
            <!-- the rest, filled by JS -->
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section">
      <div class="container">
        <h2>Contact</h2>
        <div id="contact-content"><!-- filled by JS --></div>
        <div id="contact-edit" hidden>
          <div class="rtf-toolbar">
            <button type="button" data-cmd="bold" title="Bold"><strong>B</strong></button>
            <button type="button" data-cmd="italic" title="Italic"><em>I</em></button>
            <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
            <button type="button" id="contact-link-btn" title="Insert link">Link</button>
          </div>
          <div id="contact-editor" class="rtf-editor" contenteditable="true" spellcheck="true"></div>
          <div class="about-edit-actions">
            <button id="contact-save">Save</button>
            <button id="contact-cancel" class="btn-ghost">Cancel</button>
          </div>
        </div>
        <button id="contact-edit-btn" hidden>Edit</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Ryan O'Keefe · <a href="https://okeefe.work">okeefe.work</a></p>
  </footer>

  <!-- Project edit modal (admin only). Errors go to the shared error banner
       rather than an inline slot, so failures stay in one place. -->
  <div id="project-edit-modal" class="modal-backdrop" hidden aria-modal="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal">
      <h3 id="modal-title" class="modal-title">Edit Project</h3>
      <form id="project-edit-form" class="modal-form">
        <label class="modal-label">
          Name
          <input type="text" id="edit-name" class="modal-input" required />
        </label>
        <label class="modal-label">
          Description
          <textarea id="edit-description" class="modal-textarea" rows="3"></textarea>
        </label>
        <label class="modal-label">
          Language
          <input type="text" id="edit-language" class="modal-input" />
        </label>
        <label class="modal-label">
          Hosted URL
          <input type="url" id="edit-url" class="modal-input" required />
        </label>
        <label class="modal-label">
          GitHub URL
          <input type="url" id="edit-github-url" class="modal-input" required />
        </label>
        <div class="modal-actions">
          <button type="submit" id="edit-save">Save</button>
          <button type="button" id="edit-cancel" class="btn-ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="slug.js"></script>
  <script src="app.js"></script>
</body>
</html>
